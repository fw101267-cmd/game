<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guns, Gore & Cannoli — Browser Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #eee;
    overflow: hidden;
  }
  #wrapper {
    text-align: center;
  }
  canvas {
    background: #2c3e50;
    border: 4px solid #c0392b;
    border-radius: 6px;
    box-shadow: 0 0 30px rgba(192, 57, 43, 0.4);
    display: block;
    margin: 0 auto;
  }
  #ui {
    margin-top: 12px;
    font-size: 18px;
    letter-spacing: 1px;
  }
  #title {
    font-size: 28px;
    font-weight: 800;
    color: #e74c3c;
    text-shadow: 2px 2px 0 #000;
    margin-bottom: 8px;
  }
  .hint { font-size: 14px; color: #aaa; margin-top: 6px; }
</style>
</head>
<body>
<div id="wrapper">
  <div id="title">GUNS, GORE & CANNOLI</div>
  <canvas id="game" width="960" height="540"></canvas>
  <div id="ui">
    <span id="score">Score: 0</span> &nbsp;|&nbsp;
    <span id="lives">Lives: 3</span> &nbsp;|&nbsp;
    <span id="ammo">Ammo: ∞</span>
  </div>
  <div class="hint">A/D or ←→ move • W/Space jump • Mouse aim • Left-click shoot • R restart</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ========== GAME STATE ==========
let score = 0;
let lives = 3;
let gameOver = false;
let cameraX = 0;
const GRAVITY = 0.55;
const FRICTION = 0.82;

// ========== INPUT ==========
const keys = {};
const mouse = { x: 0, y: 0, down: false };
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR' && gameOver) restart();
});
window.addEventListener('keyup', e => keys[e.code] = false);
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
canvas.addEventListener('mousedown', () => mouse.down = true);
canvas.addEventListener('mouseup', () => mouse.down = false);

// ========== PLAYER ==========
const player = {
  x: 100, y: 300, w: 28, h: 42,
  vx: 0, vy: 0,
  onGround: false,
  facing: 1,
  shootCooldown: 0,
  invuln: 0,
  color: '#f1c40f'
};

// ========== BULLETS / PARTICLES / ENEMIES ==========
let bullets = [];
let particles = [];
let enemies = [];
let powerups = [];
let platforms = [];
let gore = []; // blood splatters

// ========== LEVEL ==========
function createLevel() {
  platforms = [
    { x: 0, y: 480, w: 3000, h: 60 },          // ground
    { x: 280, y: 380, w: 140, h: 20 },
    { x: 520, y: 320, w: 120, h: 20 },
    { x: 780, y: 380, w: 160, h: 20 },
    { x: 1100, y: 300, w: 100, h: 20 },
    { x: 1350, y: 360, w: 180, h: 20 },
    { x: 1650, y: 280, w: 120, h: 20 },
    { x: 1900, y: 380, w: 200, h: 20 },
    { x: 2300, y: 320, w: 150, h: 20 },
  ];

  enemies = [
    makeEnemy(400, 430, 'thug'),
    makeEnemy(650, 430, 'thug'),
    makeEnemy(900, 430, 'tommy'),
    makeEnemy(1200, 250, 'thug'),
    makeEnemy(1450, 310, 'tommy'),
    makeEnemy(1750, 230, 'thug'),
    makeEnemy(2050, 330, 'boss'),
  ];

  powerups = [
    { x: 350, y: 340, type: 'cannoli', taken: false },
    { x: 1000, y: 250, type: 'ammo', taken: false },
    { x: 1600, y: 230, type: 'cannoli', taken: false },
  ];
}

function makeEnemy(x, y, type) {
  const base = { x, y, w: 30, h: 40, vx: 0, vy: 0, hp: 3, type, shootCooldown: 0, dead: false };
  if (type === 'tommy') { base.hp = 5; base.w = 34; }
  if (type === 'boss') { base.hp = 25; base.w = 50; base.h = 55; }
  return base;
}

// ========== HELPERS ==========
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function spawnGore(x, y, amount = 12) {
  for (let i = 0; i < amount; i++) {
    gore.push({
      x, y,
      vx: (Math.random() - 0.5) * 9,
      vy: (Math.random() - 0.8) * 10,
      life: 40 + Math.random() * 30,
      size: 2 + Math.random() * 4,
      color: Math.random() > 0.3 ? '#c0392b' : '#8e1b1b'
    });
  }
}

function spawnParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 20 + Math.random() * 20,
      color
    });
  }
}

// ========== UPDATE ==========
function update() {
  if (gameOver) return;

  // Player movement
  if (keys['KeyA'] || keys['ArrowLeft']) { player.vx = -5.2; player.facing = -1; }
  else if (keys['KeyD'] || keys['ArrowRight']) { player.vx = 5.2; player.facing = 1; }
  else player.vx *= FRICTION;

  if ((keys['KeyW'] || keys['Space'] || keys['ArrowUp']) && player.onGround) {
    player.vy = -12.5;
    player.onGround = false;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  // Platform collision
  player.onGround = false;
  for (const p of platforms) {
    if (rectsOverlap(player, p)) {
      // land on top
      if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 8) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }

  // Keep player in world
  if (player.y > H + 100) {
    die();
  }

  // Camera
  cameraX = player.x - 280;
  if (cameraX < 0) cameraX = 0;

  // Shooting
  if (player.shootCooldown > 0) player.shootCooldown--;
  if (mouse.down && player.shootCooldown <= 0) {
    const angle = Math.atan2(mouse.y - (player.y + player.h/2 - cameraX * 0 + 0), mouse.x - (player.x - cameraX + player.w/2));
    // world coords
    const wx = player.x + player.w/2;
    const wy = player.y + player.h/2;
    const mx = mouse.x + cameraX;
    const my = mouse.y;
    const ang = Math.atan2(my - wy, mx - wx);

    bullets.push({
      x: wx, y: wy,
      vx: Math.cos(ang) * 14,
      vy: Math.sin(ang) * 14,
      life: 60,
      fromPlayer: true
    });
    player.shootCooldown = 8;
    spawnParticles(wx, wy, '#f1c40f', 4);
  }

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    if (b.life <= 0) { bullets.splice(i, 1); continue; }

    // hit enemies
    if (b.fromPlayer) {
      for (const e of enemies) {
        if (!e.dead && rectsOverlap({x:b.x-4,y:b.y-4,w:8,h:8}, e)) {
          e.hp--;
          bullets.splice(i, 1);
          spawnParticles(b.x, b.y, '#e74c3c', 6);
          if (e.hp <= 0) {
            e.dead = true;
            spawnGore(e.x + e.w/2, e.y + e.h/2, e.type === 'boss' ? 40 : 18);
            score += e.type === 'boss' ? 500 : e.type === 'tommy' ? 150 : 75;
            updateUI();
          }
          break;
        }
      }
    } else {
      // enemy bullet hits player
      if (player.invuln <= 0 && rectsOverlap({x:b.x-4,y:b.y-4,w:8,h:8}, player)) {
        bullets.splice(i, 1);
        die();
      }
    }
  }

  // Enemies AI
  for (const e of enemies) {
    if (e.dead) continue;
    e.vy += GRAVITY;
    e.y += e.vy;

    // simple platform collision
    for (const p of platforms) {
      if (rectsOverlap(e, p) && e.vy > 0) {
        e.y = p.y - e.h;
        e.vy = 0;
      }
    }

    // face player & shoot occasionally
    const dx = player.x - e.x;
    e.facing = dx > 0 ? 1 : -1;

    if (e.shootCooldown > 0) e.shootCooldown--;
    else if (Math.abs(dx) < 500 && Math.random() < 0.02) {
      const ang = Math.atan2(player.y - e.y, player.x - e.x);
      bullets.push({
        x: e.x + e.w/2, y: e.y + e.h/2,
        vx: Math.cos(ang) * 7,
        vy: Math.sin(ang) * 7,
        life: 90,
        fromPlayer: false
      });
      e.shootCooldown = e.type === 'boss' ? 25 : 50;
    }

    // move a bit
    if (e.type !== 'boss') e.x += e.facing * 0.6;
  }

  // Powerups
  for (const p of powerups) {
    if (p.taken) continue;
    if (rectsOverlap(player, {x:p.x, y:p.y, w:24, h:24})) {
      p.taken = true;
      if (p.type === 'cannoli') {
        score += 100;
        lives = Math.min(lives + 1, 5);
        spawnParticles(p.x, p.y, '#f39c12', 15);
      } else {
        score += 50;
        spawnParticles(p.x, p.y, '#3498db', 12);
      }
      updateUI();
    }
  }

  // Particles & gore
  for (let i = particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }
  for (let i = gore.length-1; i>=0; i--) {
    const g = gore[i];
    g.x += g.vx; g.y += g.vy; g.vy += 0.3; g.life--;
    if (g.life <= 0) gore.splice(i,1);
  }

  if (player.invuln > 0) player.invuln--;
}

function die() {
  if (player.invuln > 0) return;
  lives--;
  spawnGore(player.x + player.w/2, player.y + player.h/2, 25);
  updateUI();
  if (lives <= 0) {
    gameOver = true;
  } else {
    player.x = 100;
    player.y = 300;
    player.vx = player.vy = 0;
    player.invuln = 90;
    cameraX = 0;
  }
}

function restart() {
  score = 0;
  lives = 3;
  gameOver = false;
  bullets = [];
  particles = [];
  gore = [];
  player.x = 100; player.y = 300; player.vx = 0; player.vy = 0; player.invuln = 0;
  cameraX = 0;
  createLevel();
  updateUI();
}

function updateUI() {
  document.getElementById('score').textContent = `Score: ${score}`;
  document.getElementById('lives').textContent = `Lives: ${lives}`;
}

// ========== DRAW ==========
function draw() {
  ctx.clearRect(0, 0, W, H);

  // sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#2c3e50');
  grad.addColorStop(1, '#1a252f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // distant buildings (parallax)
  ctx.fillStyle = '#1e2a35';
  for (let i = 0; i < 20; i++) {
    const bx = (i * 180 - cameraX * 0.3) % (W + 200) - 50;
    ctx.fillRect(bx, 180 + (i%3)*30, 90 + (i%4)*20, 300);
  }

  ctx.save();
  ctx.translate(-cameraX, 0);

  // platforms
  for (const p of platforms) {
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#95a5a6';
    ctx.fillRect(p.x, p.y, p.w, 6);
  }

  // powerups
  for (const p of powerups) {
    if (p.taken) continue;
    if (p.type === 'cannoli') {
      ctx.fillStyle = '#f39c12';
      ctx.beginPath();
      ctx.ellipse(p.x+12, p.y+12, 14, 8, 0.4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(p.x+6, p.y+8, 12, 4);
    } else {
      ctx.fillStyle = '#3498db';
      ctx.fillRect(p.x+4, p.y+4, 16, 16);
      ctx.fillStyle = '#fff';
      ctx.font = '12px sans-serif';
      ctx.fillText('A', p.x+7, p.y+16);
    }
  }

  // gore
  for (const g of gore) {
    ctx.globalAlpha = Math.min(1, g.life / 20);
    ctx.fillStyle = g.color;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // enemies
  for (const e of enemies) {
    if (e.dead) continue;
    ctx.fillStyle = e.type === 'boss' ? '#8e44ad' : e.type === 'tommy' ? '#c0392b' : '#e74c3c';
    ctx.fillRect(e.x, e.y, e.w, e.h);
    // hat
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(e.x - 2, e.y - 8, e.w + 4, 10);
    // face
    ctx.fillStyle = '#f5cba7';
    ctx.fillRect(e.x + 6, e.y + 8, e.w - 12, 14);
  }

  // player
  if (player.invuln <= 0 || Math.floor(player.invuln / 4) % 2 === 0) {
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.w, player.h);
    // hat
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(player.x - 3, player.y - 10, player.w + 6, 12);
    // face
    ctx.fillStyle = '#f5cba7';
    ctx.fillRect(player.x + 5, player.y + 6, player.w - 10, 12);
  }

  // bullets
  for (const b of bullets) {
    ctx.fillStyle = b.fromPlayer ? '#f1c40f' : '#e74c3c';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
    ctx.fill();
  }

  // particles
  for (const p of particles) {
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // crosshair
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mouse.x - 10, mouse.y); ctx.lineTo(mouse.x + 10, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - 10); ctx.lineTo(mouse.x, mouse.y + 10);
  ctx.stroke();

  // Game Over
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('WASTED', W/2, H/2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.fillText(`Final Score: ${score}`, W/2, H/2 + 30);
    ctx.font = '18px sans-serif';
    ctx.fillText('Press R to restart', W/2, H/2 + 70);
  }
}

// ========== LOOP ==========
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

createLevel();
updateUI();
loop();
</script>
</body>
</html>
